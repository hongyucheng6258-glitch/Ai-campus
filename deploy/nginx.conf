# ============================================================
# AI 校园综合服务平台 - Nginx 部署配置
# 功能：
#   1. 托管学生端 (web/frontend/student/dist) 与管理端 (web/frontend/admin/dist) 静态资源
#   2. 将 /api 反向代理到后端 SpringBoot (127.0.0.1:8080)
#   3. 透传 Host / 真实 IP，支持 WebSocket 升级（便于后续扩展）
# 使用：拷贝本文件为 /etc/nginx/conf.d/campus.conf 后 `nginx -s reload`
# ============================================================

# 若使用 HTTPS，可在此放置 cert 与 ssl 相关指令；演示环境用 HTTP 80 端口。
server {
    listen 80;
    server_name _;   # 演示用通配；生产改为实际域名，如 campus.example.com

    # ---------- 学生端（web/frontend/student/dist） ----------
    location /student/ {
        alias /usr/share/nginx/html/student/;
        index index.html;
        # Vue history 路由兜底：未匹配到文件时回退 index.html
        try_files $uri $uri/ /student/index.html;
    }

    # ---------- 管理端（web/frontend/admin/dist） ----------
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 根路径默认进学生端
    location = / {
        return 302 /student/;
    }

    # ---------- 私信 WebSocket 反代 ----------
    location /ws/chat {
        proxy_pass http://127.0.0.1:8080/ws/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # ---------- 后端 API 反代 ----------
    location /api/ {
        # 保留 /api 前缀，后端 Controller 路由均以 /api 开头。
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # 透传请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（如后续接入实时消息）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置（AI 接口可能较慢，适当放宽）
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ---------- MinIO 可选透传（如希望走 Nginx 域名访问附件） ----------
    # 演示环境前端通常直连 MINIO_ENDPOINT，此处保留注释示例：
    # location /oss/ {
    #     proxy_pass http://127.0.0.1:9000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # 基础安全：隐藏 Nginx 版本
    server_tokens off;
}
